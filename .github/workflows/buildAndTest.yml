# Jobs to test the code base and build the client and server app
name: Build and test

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  # Triggers the workflow on any push or pull request
  push:
  pull_request_target:

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

run-name: "Build and test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:

  # We only need the minimum

  code-checks:
    name: Check code and run unit tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: actions/setup-java@v5
      with:
        cache: 'gradle'
        distribution: 'temurin'
        java-version: 21

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Compile kotlin and build classes
      run: ./gradlew classes

    - name: Run code checks
      id: run_checks
      continue-on-error: true
      run: |
        ./gradlew check 2>&1 | tee check_output.log
        echo "check_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

    - name: Extract test failures
      if: steps.run_checks.outputs.check_exit_code != '0'
      id: extract_failures
      run: |
        # Extract relevant failure information from check output
        FAILURE_CONTENT=$(awk '/FAILED|STANDARD_OUT/{p=1} p{print} /^[[:space:]]*$/ && p{p=0}' check_output.log | head -100)

        # Save to file and create GitHub output
        echo "$FAILURE_CONTENT" > test_failures.txt

        # Create multiline output for GitHub
        echo "failures<<EOF" >> $GITHUB_OUTPUT
        echo "$FAILURE_CONTENT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Comment test failures on PR
      if: steps.run_checks.outputs.check_exit_code != '0' && 'push' == 'pull_request'
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.ACTIONS_ACCESS_TOKEN }}
        script: |
          const fs = require('fs');
          const failures = fs.readFileSync('test_failures.txt', 'utf8');
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const body = `## ❌ Test Failures Detected

          The following tests failed in this PR:

          \`\`\`
          ${failures}
          \`\`\`

          [View full test output](${runUrl})
          `;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });

    - name: Fail workflow if checks failed
      if: steps.run_checks.outputs.check_exit_code != '0'
      run: exit 1
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
